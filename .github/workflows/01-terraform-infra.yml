name: "01 - Terraform AWS Infrastructure CI/CD"

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/01-terraform-infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target AWS Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: "Terraform Action"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply
          - status
          - destroy
      enable_acm_ssl:
        description: "Provision AWS ACM SSL Certificate (Root + Wildcard DNS via Terraform)"
        required: false
        default: true
        type: boolean


permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  validate:
    name: "Terraform Lint & Validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Check Formatting
        run: terraform fmt -check -recursive

      - name: Terraform Init (Local validation)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  infra:
    name: "AWS Infra (${{ github.event.inputs.action || 'plan' }} - ${{ github.event.inputs.environment || 'dev' }})"
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME || 'devopsatolyesi.com' }}
      TF_VAR_enable_cloudflare: true
      TF_VAR_enable_acm_ssl: ${{ inputs.enable_acm_ssl || true }}

    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Prepare Dynamic S3 Backend (Pure S3)
        id: s3-setup
        run: |
          AWS_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="astronomy-tfstate-${ACCOUNT_ID}-${{ inputs.environment }}"
          echo "Using S3 state bucket: ${BUCKET_NAME}"
          echo "BUCKET_NAME=${BUCKET_NAME}" >> $GITHUB_ENV
          echo "AWS_REGION=${AWS_REGION}" >> $GITHUB_ENV

          if ! aws s3api head-bucket --bucket "${BUCKET_NAME}" 2>/dev/null; then
            echo "Creating S3 bucket ${BUCKET_NAME} in ${AWS_REGION}..."
            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "${BUCKET_NAME}" --region "${AWS_REGION}"
            else
              aws s3api create-bucket --bucket "${BUCKET_NAME}" --region "${AWS_REGION}" \
                --create-bucket-configuration LocationConstraint="${AWS_REGION}"
            fi
            aws s3api put-bucket-versioning --bucket "${BUCKET_NAME}" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "${BUCKET_NAME}" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          else
            echo "S3 state bucket ${BUCKET_NAME} is ready."
          fi

      - name: Terraform Init with S3 Backend
        run: |
          terraform init \
            -reconfigure \
            -backend-config="bucket=${BUCKET_NAME}" \
            -backend-config="key=environments/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Plan
        if: inputs.action == 'plan'
        run: |
          terraform plan \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var="enable_acm_ssl=${{ inputs.enable_acm_ssl }}" \
            -no-color

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: |
          terraform apply \
            -auto-approve \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var="enable_acm_ssl=${{ inputs.enable_acm_ssl }}"

      - name: Sync ACM DNS Validation Records to Cloudflare & Validate
        if: inputs.action == 'apply' && inputs.enable_acm_ssl != false
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME || 'devopsatolyesi.com' }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ZONE_ID" ]; then
            echo "Checking AWS ACM certificates for DNS validation records..."
            for CERT_ARN in $(aws acm list-certificates --region "${AWS_REGION}" --query 'CertificateSummaryList[*].CertificateArn' --output text 2>/dev/null || echo ""); do
              REC_NAME=$(aws acm describe-certificate --certificate-arn "$CERT_ARN" --region "${AWS_REGION}" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Name' --output text 2>/dev/null || echo "")
              REC_VAL=$(aws acm describe-certificate --certificate-arn "$CERT_ARN" --region "${AWS_REGION}" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Value' --output text 2>/dev/null || echo "")
              if [ -n "$REC_NAME" ] && [ "$REC_NAME" != "None" ] && [ -n "$REC_VAL" ] && [ "$REC_VAL" != "None" ]; then
                CLEAN_NAME=$(echo "$REC_NAME" | sed 's/\.$//' | sed "s/\.${DOMAIN_NAME}$//")
                echo "Configuring Cloudflare DNS validation CNAME: ${CLEAN_NAME}.${DOMAIN_NAME} -> ${REC_VAL}"
                EXISTING_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${CLEAN_NAME}.${DOMAIN_NAME}&type=CNAME" \
                  -H "Authorization: Bearer ${CF_API_TOKEN}" \
                  -H "Content-Type: application/json" | jq -r '.result[0].id // empty')

                if [ -n "$EXISTING_ID" ]; then
                  curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${EXISTING_ID}" \
                    -H "Authorization: Bearer ${CF_API_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data "{\"type\":\"CNAME\",\"name\":\"${CLEAN_NAME}\",\"content\":\"${REC_VAL}\",\"ttl\":60,\"proxied\":false}" >/dev/null
                else
                  curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
                    -H "Authorization: Bearer ${CF_API_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data "{\"type\":\"CNAME\",\"name\":\"${CLEAN_NAME}\",\"content\":\"${REC_VAL}\",\"ttl\":60,\"proxied\":false}" >/dev/null
                fi
              fi
            done

            echo "Waiting for AWS ACM Certificate validation (Status -> ISSUED)..."
            for CERT_ARN in $(aws acm list-certificates --region "${AWS_REGION}" --query 'CertificateSummaryList[*].CertificateArn' --output text 2>/dev/null || echo ""); do
              aws acm wait certificate-validated --certificate-arn "$CERT_ARN" --region "${AWS_REGION}" 2>/dev/null || true
              STATUS=$(aws acm describe-certificate --certificate-arn "$CERT_ARN" --region "${AWS_REGION}" --query 'Certificate.Status' --output text 2>/dev/null || echo "")
              echo "Certificate ${CERT_ARN} status: ${STATUS}"
            done
          fi

      - name: Configure Kubeconfig & Inspect Nodes
        if: inputs.action == 'apply' || inputs.action == 'status'

        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          echo "Connecting to EKS cluster: ${CLUSTER_NAME} in ${AWS_REGION}..."
          aws eks --region "${AWS_REGION}" update-kubeconfig --name "${CLUSTER_NAME}"
          kubectl get nodes -o wide

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: |
          echo "Starting clean teardown of EKS cluster and VPC..."
          CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || echo "astronomy-shop")
          aws eks --region "${AWS_REGION}" update-kubeconfig --name "${CLUSTER_NAME}" 2>/dev/null || true
          
          # Delete any remaining LoadBalancer services to release AWS ELBs cleanly
          kubectl delete svc --all --all-namespaces --timeout=60s 2>/dev/null || true
          
          # Clean any ACM certificates
          for cert in $(aws acm list-certificates --region "${AWS_REGION}" --query 'CertificateSummaryList[*].CertificateArn' --output text 2>/dev/null || true); do
            echo "Deleting ACM certificate: ${cert}..."
            aws acm delete-certificate --certificate-arn "$cert" --region "${AWS_REGION}" 2>/dev/null || true
          done

          terraform destroy \
            -auto-approve \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var="enable_acm_ssl=${{ inputs.enable_acm_ssl }}"

