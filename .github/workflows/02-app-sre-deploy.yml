name: "02 - Application & SRE Platform CD"

on:
  pull_request:
    paths:
      - 'observability/**'
      - 'sre-slo/**'
      - 'scripts/**'
      - '.github/workflows/02-app-sre-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target AWS Environment (EKS Cluster)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: "Deployment Action"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - validate
          - undeploy
      deploy_sre_stack:
        description: "Deploy SRE Stack (OpenTelemetry Collector, Prometheus, Tempo, Grafana, SLOs)"
        required: false
        default: true
        type: boolean
      deploy_incluster_grafana:
        description: "Deploy In-Cluster Grafana (Set false to use external Grafana)"
        required: false
        default: true
        type: boolean
      deploy_sonarqube:
        description: "Deploy In-Cluster SonarQube Server"
        required: false
        default: false
        type: boolean
      external_grafana_url:
        description: "External Grafana URL (Fallback if in-cluster Grafana disabled)"
        required: false
        default: "https://grafana.devopsatolyesi.com"
        type: string
      deploy_astronomy_shop:
        description: "Deploy Astronomy Shop Microservices (via Helm)"
        required: false
        default: true
        type: boolean
      enable_ssl:
        description: "Enable Let's Encrypt Automated SSL/TLS (cert-manager HTTP-01 on Ingress)"
        required: false
        default: true
        type: boolean
      acm_certificate_arn:
        description: "Custom AWS ACM Certificate ARN (Optional - auto-discovered if blank)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: "SRE Platform (${{ github.event.inputs.action || 'deploy' }} - ${{ github.event.inputs.environment || 'dev' }})"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Connect to EKS Cluster
        run: |
          AWS_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          CLUSTER_NAME="astronomy-shop-${{ inputs.environment || 'dev' }}"
          echo "Configuring kubectl for EKS cluster: ${CLUSTER_NAME} in ${AWS_REGION}..."
          aws eks --region "${AWS_REGION}" update-kubeconfig --name "${CLUSTER_NAME}"
          kubectl get nodes -o wide

      - name: Deploy SRE Observability Stack (OpenTelemetry Collector, Prometheus, Tempo, Grafana)
        if: (inputs.action == 'deploy' || github.event_name == 'pull_request') && inputs.deploy_sre_stack != false
        run: |
          echo "0/4 Ensuring Kubernetes Namespaces exist..."
          kubectl create namespace opentelemetry --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace astronomy-shop --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace sonarqube --dry-run=client -o yaml | kubectl apply -f -

          echo "1/4 Deploying OpenTelemetry Collector..."
          kubectl apply -f observability/otel-collector-config.yaml
          kubectl apply -f observability/04-otel-collector-deployment.yaml
          kubectl rollout status deployment/otel-collector -n opentelemetry --timeout=180s || true

          echo "2/4 Deploying Prometheus TSDB & Grafana Tempo..."
          kubectl apply -f sre-slo/01-slo-definitions.yaml
          kubectl apply -f observability/01-prometheus-statefulset.yaml
          kubectl apply -f observability/02-tempo-statefulset.yaml

          if [ "${{ inputs.deploy_incluster_grafana }}" != "false" ]; then
            echo "Deploying In-Cluster Grafana Dashboard..."
            kubectl apply -f observability/03-grafana-deployment.yaml
            kubectl -n monitoring patch svc grafana -p '{"spec": {"type": "ClusterIP"}}' || true
            kubectl rollout status deployment/grafana -n monitoring --timeout=180s || true
          fi

          kubectl rollout status statefulset/prometheus -n monitoring --timeout=180s || true
          kubectl rollout status statefulset/tempo -n monitoring --timeout=180s || true
          kubectl -n monitoring get all

      - name: Deploy SonarQube Code Quality Server (Optional In-Cluster)
        if: (inputs.action == 'deploy' || github.event_name == 'pull_request') && inputs.deploy_sonarqube == true
        run: |
          echo "Deploying in-cluster SonarQube..."
          kubectl apply -f observability/06-sonarqube-deployment.yaml
          kubectl rollout status deployment/sonarqube -n sonarqube --timeout=240s || true
          kubectl get pods,svc -n sonarqube

      - name: Deploy OpenTelemetry Astronomy Shop Microservices (Helm)
        if: (inputs.action == 'deploy' || github.event_name == 'pull_request') && inputs.deploy_astronomy_shop != false
        run: |
          echo "3/4 Deploying Astronomy Shop Microservices via Helm (Production SRE values)..."
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update
          helm repo update
          helm upgrade --install astronomy-shop open-telemetry/opentelemetry-demo \
            --namespace astronomy-shop --create-namespace \
            -f observability/values-production.yaml \
            --timeout 10m || true

          # Ensure all microservices use ClusterIP behind the Unified Gateway
          kubectl -n astronomy-shop patch svc frontend -p '{"spec": {"type": "ClusterIP"}}' || true
          kubectl -n astronomy-shop patch svc frontend-proxy -p '{"spec": {"type": "ClusterIP"}}' || true
          sleep 5
          kubectl -n astronomy-shop get pods,svc

      - name: "[1/4] Deploy Kubernetes Gateway API CRDs & Traefik v3 Controller"
        if: inputs.action == 'deploy' || github.event_name == 'pull_request'
        run: |
          echo "Installing Kubernetes Gateway API v1.2.0 standard CRDs..."
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml

          echo "Deploying Traefik v3 Kubernetes Gateway API Controller on AWS EKS..."
          helm repo add traefik https://traefik.github.io/charts --force-update
          helm repo update
          helm upgrade --install traefik traefik/traefik \
            --namespace traefik --create-namespace \
            -f observability/traefik-values.yaml \
            --wait --timeout=300s

          kubectl get svc -n traefik

      - name: "[2/4] Deploy cert-manager (Let's Encrypt Automation Engine)"
        if: inputs.action == 'deploy' || github.event_name == 'pull_request'
        run: |
          echo "Cleaning up legacy non-Helm cert-manager objects to allow clean Helm installation..."
          kubectl delete -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml --ignore-not-found=true || true
          kubectl delete role,rolebinding -n kube-system cert-manager-cainjector:leaderelection cert-manager:leaderelection --ignore-not-found=true || true
          kubectl delete role,rolebinding -n kube-system -l app.kubernetes.io/instance=cert-manager --ignore-not-found=true || true
          kubectl delete role,rolebinding -n kube-system -l app.kubernetes.io/name=cert-manager --ignore-not-found=true || true
          kubectl delete role,rolebinding -n kube-system -l app=cainjector --ignore-not-found=true || true

          echo "Deploying cert-manager with Gateway API support enabled..."
          helm repo add jetstack https://charts.jetstack.io
          helm repo update jetstack
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --version v1.16.2 \
            --set crds.enabled=true \
            --set config.gatewayAPI.enabled=true \
            --wait --timeout=300s

          echo "Waiting for cert-manager webhook to be ready..."
          kubectl wait --namespace cert-manager \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=webhook \
            --timeout=180s

      - name: "[3/4] Deploy Kubernetes Gateway & HTTPRoutes"
        if: inputs.action == 'deploy' || github.event_name == 'pull_request'
        run: |
          echo "Applying Gateway API Gateway, HTTPRoutes, and Let's Encrypt ClusterIssuer..."
          kubectl create namespace astronomy-shop --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace sonarqube --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f observability/05-unified-ingress.yaml
          kubectl get gateway,httproute -A

      - name: "[4/4] Sync Cloudflare DNS Records (DNS-Only / proxied: false)"
        if: inputs.action == 'deploy' || github.event_name == 'pull_request'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          DOMAIN="devopsatolyesi.com"

          echo "Fetching AWS Load Balancer hostname from Traefik Gateway..."
          GATEWAY_URL=""
          for i in {1..40}; do
            GATEWAY_URL=$(kubectl get svc -n traefik traefik -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            [ -n "$GATEWAY_URL" ] && break
            echo "Waiting for Traefik LoadBalancer hostname... ($i/40)"
            sleep 5
          done

          if [ -z "$GATEWAY_URL" ]; then
            echo "Error: Traefik LoadBalancer did not get a hostname in time."
            kubectl describe svc -n traefik traefik
            exit 1
          fi
          echo "AWS LoadBalancer Hostname: ${GATEWAY_URL}"
          echo "GATEWAY_URL=${GATEWAY_URL}" >> $GITHUB_ENV

          # Helper: Upsert Cloudflare CNAME as DNS-only (proxied=false)
          upsert_cname() {
            local NAME=$1 TARGET=$2 PROXIED="false" TTL=60
            echo "-> CNAME ${NAME}.${DOMAIN} -> ${TARGET} (DNS-only, proxied=false)"
            local EXISTING
            EXISTING=$(curl -sf -X GET \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${NAME}.${DOMAIN}&type=CNAME" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" | jq -r '.result[0].id // empty' 2>/dev/null || echo "")

            local PAYLOAD="{\"type\":\"CNAME\",\"name\":\"${NAME}\",\"content\":\"${TARGET}\",\"ttl\":${TTL},\"proxied\":false}"
            local RESP
            if [ -n "$EXISTING" ]; then
              RESP=$(curl -sf -X PUT \
                "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${EXISTING}" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
                --data "$PAYLOAD" 2>/dev/null || echo '{"success":false}')
              echo "   UPDATE: $(echo $RESP | jq -c '{success:.success,errors:.errors}' 2>/dev/null)"
            else
              RESP=$(curl -sf -X POST \
                "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
                --data "$PAYLOAD" 2>/dev/null || echo '{"success":false}')
              echo "   CREATE: $(echo $RESP | jq -c '{success:.success,errors:.errors}' 2>/dev/null)"
            fi
          }

          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ZONE_ID" ]; then
            echo "=== Upserting Cloudflare DNS Records (DNS-Only for Let's Encrypt) ==="
            upsert_cname "astronomy" "${GATEWAY_URL}"
            [ "${{ inputs.deploy_incluster_grafana }}" != "false" ] && upsert_cname "grafana" "${GATEWAY_URL}"
            [ "${{ inputs.deploy_sonarqube }}" = "true" ]           && upsert_cname "sonar"   "${GATEWAY_URL}"
          fi

          echo "Waiting up to 60s for Let's Encrypt Certificates to be issued..."
          kubectl wait --for=condition=Ready certificate --all -A --timeout=60s || true
          kubectl get certificate -A || true

      - name: "Print Final Endpoints"
        if: inputs.action == 'deploy' || inputs.action == 'validate'
        run: |
          echo ""
          echo "================================================================================"
          DOMAIN="devopsatolyesi.com"
          echo "🚀 Routing Layer: Kubernetes Gateway API v1 (Traefik v3 Controller)"
          echo "🔒 TLS Status: Let's Encrypt Automated Gateway TLS"
          echo "👉 🔭 Astronomy Shop:  https://astronomy.${DOMAIN}"
          echo "👉 📊 Grafana SRE:    https://grafana.${DOMAIN}"
          if [ -n "${GATEWAY_URL:-}" ]; then
            echo "👉 🌐 Direct ALB URL: http://${GATEWAY_URL}"
          fi
          echo "================================================================================"
          echo ""

      - name: Run SRE Verification Tests
        if: inputs.action == 'deploy' || inputs.action == 'validate'
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh || true

      - name: Undeploy Applications (Clean Teardown)
        if: inputs.action == 'undeploy'
        run: |
          echo "1/4 Uninstalling Astronomy Shop microservices (Helm)..."
          helm uninstall astronomy-shop --namespace astronomy-shop 2>/dev/null || true
          kubectl delete namespace astronomy-shop --timeout=60s 2>/dev/null || true

          echo "2/4 Deleting Gateway API and Traefik Load Balancers..."
          kubectl delete -f observability/05-unified-ingress.yaml 2>/dev/null || true
          helm uninstall traefik --namespace traefik 2>/dev/null || true
          kubectl delete namespace traefik --timeout=60s 2>/dev/null || true

          echo "3/4 Uninstalling cert-manager..."
          kubectl delete -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml 2>/dev/null || true

          echo "4/4 Removing OpenTelemetry Collector and Prometheus/Tempo stack..."
          kubectl delete -f observability/04-otel-collector-deployment.yaml 2>/dev/null || true
          kubectl delete -f observability/otel-collector-config.yaml 2>/dev/null || true
          kubectl delete -f observability/01-prometheus-statefulset.yaml 2>/dev/null || true
          kubectl delete -f observability/02-tempo-statefulset.yaml 2>/dev/null || true
          kubectl delete -f sre-slo/ 2>/dev/null || true

          if [ "${{ inputs.deploy_incluster_grafana }}" == "false" ]; then
            kubectl delete namespace monitoring --timeout=60s 2>/dev/null || true
          fi
          if [ "${{ inputs.deploy_sonarqube }}" == "false" ]; then
            kubectl delete namespace sonarqube --timeout=60s 2>/dev/null || true
          fi

          echo "Workloads successfully cleaned up from EKS cluster."

