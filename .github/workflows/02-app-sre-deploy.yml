name: "02 - Application & SRE Platform CD"

on:
  pull_request:
    paths:
      - 'observability/**'
      - 'sre-slo/**'
      - 'scripts/**'
      - '.github/workflows/02-app-sre-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target AWS Environment (EKS Cluster)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: "Deployment Action"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - validate
          - undeploy
      deploy_sre_stack:
        description: "Deploy SRE Stack (OpenTelemetry Collector, Prometheus, Tempo, Grafana, SLOs)"
        required: false
        default: true
        type: boolean
      deploy_incluster_grafana:
        description: "Deploy In-Cluster Grafana (Set false to use external Grafana)"
        required: false
        default: true
        type: boolean
      deploy_sonarqube:
        description: "Deploy In-Cluster SonarQube Server"
        required: false
        default: false
        type: boolean
      external_grafana_url:
        description: "External Grafana URL (Fallback if in-cluster Grafana disabled)"
        required: false
        default: "https://grafana.devopsatolyesi.com"
        type: string
      deploy_astronomy_shop:
        description: "Deploy Astronomy Shop Microservices (via Helm)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: "SRE Platform (${{ github.event.inputs.action || 'deploy' }} - ${{ github.event.inputs.environment || 'dev' }})"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Connect to EKS Cluster
        run: |
          AWS_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          CLUSTER_NAME="astronomy-shop-${{ inputs.environment || 'dev' }}"
          echo "Configuring kubectl for EKS cluster: ${CLUSTER_NAME} in ${AWS_REGION}..."
          aws eks --region "${AWS_REGION}" update-kubeconfig --name "${CLUSTER_NAME}"
          kubectl get nodes -o wide

      - name: Deploy SRE Observability Stack (OpenTelemetry Collector, Prometheus, Tempo, Grafana)
        if: (inputs.action == 'deploy' || github.event_name == 'pull_request') && inputs.deploy_sre_stack != false
        run: |
          echo "0/4 Ensuring Kubernetes Namespaces exist..."
          kubectl create namespace opentelemetry --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace astronomy-shop --dry-run=client -o yaml | kubectl apply -f -

          echo "1/4 Deploying OpenTelemetry Collector..."
          kubectl apply -f observability/otel-collector-config.yaml
          kubectl apply -f observability/04-otel-collector-deployment.yaml
          kubectl rollout status deployment/otel-collector -n opentelemetry --timeout=180s || true

          echo "2/4 Deploying Prometheus TSDB & Grafana Tempo..."
          kubectl apply -f sre-slo/01-slo-definitions.yaml
          kubectl apply -f observability/01-prometheus-statefulset.yaml
          kubectl apply -f observability/02-tempo-statefulset.yaml

          if [ "${{ inputs.deploy_incluster_grafana }}" != "false" ]; then
            echo "Deploying In-Cluster Grafana Dashboard..."
            kubectl apply -f observability/03-grafana-deployment.yaml
            kubectl -n monitoring patch svc grafana -p '{"spec": {"type": "LoadBalancer"}}' || true
            kubectl rollout status deployment/grafana -n monitoring --timeout=180s || true
          fi

          kubectl rollout status statefulset/prometheus -n monitoring --timeout=180s || true
          kubectl rollout status statefulset/tempo -n monitoring --timeout=180s || true
          kubectl -n monitoring get all

      - name: Deploy SonarQube Code Quality Server (Optional In-Cluster)
        if: (inputs.action == 'deploy' || github.event_name == 'pull_request') && inputs.deploy_sonarqube == true
        run: |
          echo "Deploying in-cluster SonarQube..."
          kubectl apply -f observability/06-sonarqube-deployment.yaml
          kubectl rollout status deployment/sonarqube -n sonarqube --timeout=240s || true
          kubectl get pods,svc -n sonarqube

      - name: Deploy OpenTelemetry Astronomy Shop Microservices (Helm)
        if: (inputs.action == 'deploy' || github.event_name == 'pull_request') && inputs.deploy_astronomy_shop != false
        run: |
          echo "3/4 Deploying Astronomy Shop Microservices via Helm (Production SRE values)..."
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update
          helm repo update
          helm upgrade --install astronomy-shop open-telemetry/opentelemetry-demo \
            --namespace astronomy-shop --create-namespace \
            -f observability/values-production.yaml \
            --timeout 10m || true

          # Ensure frontend-proxy is exposed via LoadBalancer and frontend is ClusterIP
          kubectl -n astronomy-shop patch svc frontend -p '{"spec": {"type": "ClusterIP"}}' || true
          kubectl -n astronomy-shop patch svc frontend-proxy -p '{"spec": {"type": "LoadBalancer"}}' || true
          sleep 10
          kubectl -n astronomy-shop get pods,svc

      - name: Query Public Load Balancer & Configure Cloudflare DNS / SSL
        if: inputs.action == 'deploy' || inputs.action == 'validate'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          echo "4/4 Fetching AWS Load Balancer Hostnames..."
          for i in {1..30}; do
            FRONTEND_URL=$(kubectl get svc -n astronomy-shop frontend-proxy -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            GRAFANA_URL=$(kubectl get svc -n monitoring grafana -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$FRONTEND_URL" ]; then
              break
            fi
            echo "Waiting for Load Balancers to provision DNS hostnames... ($i/30)"
            sleep 5
          done

          if [ -z "$GRAFANA_URL" ]; then
            GRAFANA_URL=$FRONTEND_URL
          fi

          echo "AWS Load Balancer Gateway Hostname: ${FRONTEND_URL}"

          # Check Cloudflare Integration
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ZONE_ID" ]; then
            echo "Cloudflare credentials detected! Querying Cloudflare Zone..."
            ZONE_NAME=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" | jq -r '.result.name // empty')

            if [ -n "$ZONE_NAME" ]; then
              echo "Target Cloudflare Zone: ${ZONE_NAME}"

              # Function to create or update Cloudflare CNAME record
              upsert_cname() {
                local NAME=$1
                local TARGET=$2
                echo "Configuring Cloudflare DNS: ${NAME}.${ZONE_NAME} -> ${TARGET} (proxied=true)..."
                EXISTING_RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${NAME}.${ZONE_NAME}&type=CNAME" \
                  -H "Authorization: Bearer ${CF_API_TOKEN}" \
                  -H "Content-Type: application/json" | jq -r '.result[0].id // empty')

                if [ -n "$EXISTING_RECORD_ID" ]; then
                  curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${EXISTING_RECORD_ID}" \
                    -H "Authorization: Bearer ${CF_API_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data "{\"type\":\"CNAME\",\"name\":\"${NAME}\",\"content\":\"${TARGET}\",\"ttl\":1,\"proxied\":true}" > /dev/null
                else
                  curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
                    -H "Authorization: Bearer ${CF_API_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data "{\"type\":\"CNAME\",\"name\":\"${NAME}\",\"content\":\"${TARGET}\",\"ttl\":1,\"proxied\":true}" > /dev/null
                fi
              }

              upsert_cname "astronomy" "${FRONTEND_URL}"

              if [ "${{ inputs.deploy_incluster_grafana }}" != "false" ]; then
                upsert_cname "grafana" "${GRAFANA_URL}"
              fi

              if [ "${{ inputs.deploy_sonarqube }}" == "true" ]; then
                upsert_cname "sonar" "${FRONTEND_URL}"
              fi

              echo ""
              echo "================================================================================"
              echo "☁️ CLOUDFLARE SECURE HTTPS ENDPOINTS (Automatic SSL & DDoS Protection):"
              echo "👉 🔭 Astronomy Shop Web Store: https://astronomy.${ZONE_NAME}"
              if [ "${{ inputs.deploy_incluster_grafana }}" != "false" ]; then
                echo "👉 📊 Grafana SRE SLO Panel:    https://grafana.${ZONE_NAME}"
                echo "   🔑 Grafana Username: admin | Password: BilgincIT454"
              else
                echo "👉 📊 External Grafana Panel:   ${{ inputs.external_grafana_url }}"
              fi
              if [ "${{ inputs.deploy_sonarqube }}" == "true" ]; then
                echo "👉 🛡️ SonarQube Security Panel: https://sonar.${ZONE_NAME}"
                echo "   🔑 SonarQube Username: admin | Password: admin"
              fi
              echo "================================================================================"
              echo ""
            fi
          fi

          echo ""
          echo "================================================================================"
          echo "🌐 DIRECT AWS LOAD BALANCER ENDPOINTS (For Manual DNS / No-Cloudflare Mode):"
          echo "👉 🔭 Astronomy Shop Gateway: http://${FRONTEND_URL}:8080"
          if [ "${{ inputs.deploy_incluster_grafana }}" != "false" ]; then
            echo "👉 📊 In-Cluster Grafana SRE: http://${GRAFANA_URL}:3000"
            echo "   🔑 Grafana Username: admin | Password: BilgincIT454"
          else
            echo "👉 📊 External Grafana URL:   ${{ inputs.external_grafana_url }}"
          fi
          if [ "${{ inputs.deploy_sonarqube }}" == "true" ]; then
            echo "👉 🛡️ In-Cluster SonarQube:   http://${FRONTEND_URL}:9000"
            echo "   🔑 SonarQube Username: admin | Password: admin"
          fi
          echo "================================================================================"
          echo ""

      - name: Run SRE Verification Tests
        if: inputs.action == 'deploy' || inputs.action == 'validate'
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh || true

      - name: Undeploy Applications
        if: inputs.action == 'undeploy'
        run: |
          echo "Undeploying Astronomy Shop and Observability workloads..."
          helm uninstall astronomy-shop --namespace astronomy-shop 2>/dev/null || true
          kubectl delete -f observability/ 2>/dev/null || true
          kubectl delete -f sre-slo/ 2>/dev/null || true
          echo "Workloads successfully removed from cluster."
