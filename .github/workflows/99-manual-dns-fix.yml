name: "99 - Manual DNS Fix (One-Shot)"

on:
  workflow_dispatch:
    inputs:
      alb_hostname:
        description: "AWS LoadBalancer Hostname"
        required: true
        default: ""
        type: string

jobs:
  fix-dns:
    name: "Fix Cloudflare DNS (DNS-Only for Let's Encrypt)"
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Configure Cloudflare CNAME Records (DNS-Only / proxied: false)
        run: |
          ALB="${{ inputs.alb_hostname }}"
          DOMAIN="devopsatolyesi.com"

          if [ -z "$ALB" ]; then
            echo "Error: alb_hostname input is required."
            exit 1
          fi

          upsert_cname() {
            local NAME=$1
            local TARGET=$2
            local PROXIED="false"
            local TTL=60

            echo "-> Upsert CNAME: ${NAME}.${DOMAIN} -> ${TARGET} (DNS-only, proxied=false)"
            EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=${NAME}.${DOMAIN}&type=CNAME" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" | jq -r '.result[0].id // empty')

            if [ -n "$EXISTING" ]; then
              RES=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${EXISTING}" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"CNAME\",\"name\":\"${NAME}\",\"content\":\"${TARGET}\",\"ttl\":${TTL},\"proxied\":false}")
            else
              RES=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"CNAME\",\"name\":\"${NAME}\",\"content\":\"${TARGET}\",\"ttl\":${TTL},\"proxied\":false}")
            fi
            echo "   Result: $(echo $RES | jq -c '{success:.success, errors:.errors}')"
          }

          echo "=== Step 1: Upsert application CNAME records as DNS-Only ==="
          upsert_cname "astronomy" "${ALB}"
          upsert_cname "grafana" "${ALB}"
          upsert_cname "sonar" "${ALB}"

          echo "=== Step 2: Final DNS verification ==="
          echo "astronomy CNAME:"
          curl -s "https://dns.google/resolve?name=astronomy.${DOMAIN}&type=CNAME" | jq -r '.Answer[0].data // "NOT FOUND"'
          echo "grafana CNAME:"
          curl -s "https://dns.google/resolve?name=grafana.${DOMAIN}&type=CNAME" | jq -r '.Answer[0].data // "NOT FOUND"'
