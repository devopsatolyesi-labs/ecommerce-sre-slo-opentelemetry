# ==============================================================================
# OpenTelemetry Astronomy Shop - Production SRE Helm Values
# ==============================================================================

prometheus:
  enabled: false

grafana:
  enabled: false

jaeger:
  enabled: false

opentelemetry-collector:
  enabled: false

default:
  envOverrides:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://otel-collector.opentelemetry.svc.cluster.local:4317"

components:
  frontend:
    service:
      type: ClusterIP
      port: 8080

  frontend-proxy:
    service:
      type: ClusterIP
      port: 8080
