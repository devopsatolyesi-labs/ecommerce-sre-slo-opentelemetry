# ==============================================================================
# OpenTelemetry Astronomy Shop - Production SRE Helm Values
# ==============================================================================

prometheus:
  enabled: false

grafana:
  enabled: false

jaeger:
  enabled: false

opentelemetry-collector:
  enabled: false

default:
  useDefault:
    env: false
  env:
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.labels['app.kubernetes.io/component']
    - name: OTEL_COLLECTOR_NAME
      value: otel-collector
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://otel-collector.opentelemetry.svc.cluster.local:4317"
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "service.version=3.0.0,deployment.environment=dev"

components:
  frontend:
    service:
      type: ClusterIP
      port: 8080

  frontend-proxy:
    service:
      type: LoadBalancer
      port: 8080
