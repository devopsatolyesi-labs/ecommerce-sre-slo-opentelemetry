# ==============================================================================
# Kubernetes Gateway API (v1) & Let's Encrypt TLS Automation
# Parent Gateway: traefik-gateway (Namespace: traefik)
# Listeners: web (Port 80 HTTP), websecure (Port 443 HTTPS)
# ==============================================================================

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: info@devopsatolyesi.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
---
# Unified Certificate for Astronomy Shop, Grafana, and SonarQube via Let's Encrypt
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sre-platform-tls
  namespace: traefik
spec:
  secretName: sre-platform-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "astronomy.devopsatolyesi.com"
    - "grafana.devopsatolyesi.com"
---
# 1. HTTPRoute for OpenTelemetry Astronomy Shop
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: astronomy-shop-route
  namespace: astronomy-shop
  labels:
    app.kubernetes.io/name: astronomy-shop
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "astronomy.devopsatolyesi.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-proxy
          port: 8080
---
# 2. HTTPRoute for Grafana SRE & SLO Dashboard
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-sre
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "grafana.devopsatolyesi.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 80
---
# 3. Direct AWS Load Balancer Hostname Route (Fallback)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: default-alb-route
  namespace: astronomy-shop
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-proxy
          port: 8080
