# ==============================================================================
# Kubernetes Gateway API (v1) & Traefik v3 Modern Routing Architecture
# Standard: gateway.networking.k8s.io/v1
# Parent Gateway: traefik-gateway (Namespace: traefik)
# Listeners: web (Port 80 HTTP), websecure (Port 443 HTTPS)
# ==============================================================================

# 1. HTTPRoute for OpenTelemetry Astronomy Shop
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: astronomy-shop-route
  namespace: astronomy-shop
  labels:
    app.kubernetes.io/name: astronomy-shop
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "astronomy.devopsatolyesi.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-proxy
          port: 8080
---
# 2. HTTPRoute for Grafana SRE & SLO Dashboard
apiVersion: gateway.networking.k8s.io/v1
