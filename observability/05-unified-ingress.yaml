# ==============================================================================
# Unified SRE Gateway & Ingress (Single AWS Load Balancer Architecture)
# Listens on Standard Port 80 / 443 and routes via Gateway API / Ingress rules:
#   - astronomy.devopsatolyesi.com / default  -> frontend-proxy.astronomy-shop (8080)
#   - grafana.devopsatolyesi.com   / /grafana -> grafana.monitoring (3000)
#   - sonar.devopsatolyesi.com     / /sonar   -> sonarqube.sonarqube (9000)
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-proxy-config
  namespace: gateway
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        include /etc/nginx/mime.types;
        sendfile on;
        server_tokens off;

        resolver 172.20.0.10 valid=10s ipv6=off;

        # Virtual Host: Grafana (Host-based routing)
        server {
            listen 80;
            server_name grafana.* grafana;

            location / {
                set $grafana_backend "http://grafana.monitoring.svc.cluster.local:80";
                proxy_pass $grafana_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }
        }

        # Virtual Host: SonarQube (Host-based routing)
        server {
            listen 80;
            server_name sonar.* sonar;

            location / {
                set $sonar_backend "http://sonarqube.sonarqube.svc.cluster.local:9000";
                proxy_pass $sonar_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }

        # Primary Virtual Host: Astronomy Shop Storefront (Default)
        server {
            listen 80 default_server;
            server_name _;

            location /grafana/ {
                rewrite ^/grafana/(.*) /$1 break;
                set $grafana_backend "http://grafana.monitoring.svc.cluster.local:80";
                proxy_pass $grafana_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /sonar/ {
                rewrite ^/sonar/(.*) /$1 break;
                set $sonar_backend "http://sonarqube.sonarqube.svc.cluster.local:9000";
                proxy_pass $sonar_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location / {
                set $astronomy_backend "http://frontend-proxy.astronomy-shop.svc.cluster.local:8080";
                proxy_pass $astronomy_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-gateway
  namespace: gateway
  labels:
    app: unified-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unified-gateway
  template:
    metadata:
      labels:
        app: unified-gateway
    spec:
      containers:
        - name: gateway-proxy
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      volumes:
        - name: config
          configMap:
            name: gateway-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: unified-gateway
  namespace: gateway
  labels:
    app: unified-gateway
spec:
  type: LoadBalancer
  selector:
    app: unified-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
