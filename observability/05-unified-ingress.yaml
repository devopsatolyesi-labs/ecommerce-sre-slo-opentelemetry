# ==============================================================================
# Unified SRE Ingress & Let's Encrypt TLS Automation
# Let's Encrypt ClusterIssuer (HTTP-01) + Kubernetes Ingresses
# - astronomy.devopsatolyesi.com -> frontend-proxy.astronomy-shop:8080
# - grafana.devopsatolyesi.com   -> grafana.monitoring:80
# - sonar.devopsatolyesi.com     -> sonarqube.sonarqube:9000
# - Fallback: Raw ALB Hostname HTTP -> frontend-proxy.astronomy-shop:8080
# ==============================================================================

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: info@devopsatolyesi.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
# 1. Astronomy Shop Ingress (Namespace: astronomy-shop)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astronomy-shop-ingress
  namespace: astronomy-shop
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - astronomy.devopsatolyesi.com
      secretName: astronomy-shop-tls
  rules:
    - host: astronomy.devopsatolyesi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-proxy
                port:
                  number: 8080
    # Direct access fallback when accessing raw LoadBalancer DNS without domain name
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-proxy
                port:
                  number: 8080
---
# 2. Grafana SRE Dashboard Ingress (Namespace: monitoring)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.devopsatolyesi.com
      secretName: grafana-tls
  rules:
    - host: grafana.devopsatolyesi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
---
# 3. SonarQube Code Quality Ingress (Namespace: sonarqube)
apiVersion: v1
kind: Namespace
metadata:
  name: sonarqube
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarqube-ingress
  namespace: sonarqube
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "128m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sonar.devopsatolyesi.com
      secretName: sonarqube-tls
  rules:
    - host: sonar.devopsatolyesi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarqube
                port:
                  number: 9000
