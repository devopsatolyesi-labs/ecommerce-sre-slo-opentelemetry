# 4. Direct AWS Load Balancer Hostname Route (Fallback)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: default-alb-route
  namespace: astronomy-shop
spec:
  parentRefs:
    - name: traefik-gateway
