# ==============================================================================
# OpenTelemetry Collector Configuration (LGTM Stack Integration)
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: opentelemetry
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: opentelemetry
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 15s
              static_configs:
                - targets: ['0.0.0.0:8888']

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15

      batch:
        send_batch_size: 1024
        timeout: 5s

      resource:
        attributes:
          - key: deployment.environment
            value: "production"
            action: insert

    exporters:
      # Export Metrics to Prometheus
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: "ecommerce"

      # Export Traces to Grafana Tempo
      otlp/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

      # Console Debug Output
      debug:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlp/tempo, debug]

        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch, resource]
          exporters: [prometheus]

      telemetry:
        logs:
          level: "info"
        metrics:
          address: "0.0.0.0:8888"
